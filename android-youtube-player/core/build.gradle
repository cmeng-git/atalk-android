apply plugin: 'com.android.library'

ext.shard = 'core'
ext.libVersion = '10.0.5'
ext.libDescription = 'YouTube Player library for Android, stable and customizable.'

android {
    compileSdk = rootProject.compileSdk
    buildToolsVersion = rootProject.buildTools

    defaultConfig {
        namespace = 'com.pierfrancescosoffritti.androidyoutubeplayer'

        minSdkVersion rootProject.minSdk
        targetSdkVersion rootProject.compileSdk
        versionCode 15
        versionName '10.0.5'
    }

    sourceSets {
        main.res.srcDirs = [
                'src/main/res',
                'src/main/res-public'
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"

    api "androidx.annotation:annotation:1.10.0"
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}